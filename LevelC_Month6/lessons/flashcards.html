<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Week Flashcards</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/flashcards.css">
</head>
<body>
  <div class="page fc-page">
    <a class="back-link" id="fc-back" href="index.html">&#11013;&#65039; Week</a>
    <header class="center fc-header"><h1 class="big-title">&#127183; Flashcards</h1><p class="subtitle" id="fc-week-label"></p></header>
    <div class="fc-layout">
      <nav class="fc-nav" aria-label="Flashcard activities">
        <button class="fc-nav-btn is-active" data-activity="lesson">&#128218; Lesson Flashcards</button>
        <button class="fc-nav-btn" data-activity="fast">&#9889; Fast Game</button>
        <button class="fc-nav-btn" data-activity="spot">&#128294; Spot the Picture</button>
        <button class="fc-nav-btn" data-activity="sentence">&#9999;&#65039; Complete the Sentence</button>
      </nav>
      <main class="fc-main">
        <section class="fc-panel is-active" data-panel="lesson"><h2>Lesson Flashcards</h2><p>Choose a card to see it bigger.</p><div class="fc-stage" id="lesson-stage"></div><div class="fc-list" id="lesson-list"></div></section>
        <section class="fc-panel" data-panel="fast"><h2>Fast Game</h2><p>Peek for 0.3 seconds, then say the word.</p><div class="fc-stage covered" id="fast-stage"></div><div class="fc-actions"><button class="pill-btn blue" id="fast-peek">Peek</button><button class="pill-btn orange" id="fast-show">Show</button><button class="pill-btn green" id="fast-next">New Card</button></div></section>
        <section class="fc-panel" data-panel="spot"><h2>Spot the Picture</h2><p>Move the spotlight and guess the card.</p><div class="fc-stage spot-stage" id="spot-stage" tabindex="0"><div class="spot-mask"></div></div><div class="fc-actions"><button class="pill-btn orange" id="spot-show">Show</button><button class="pill-btn green" id="spot-next">New Card</button></div></section>
        <section class="fc-panel" data-panel="sentence"><h2>Complete the Sentence</h2><p>Choose a card to complete the sentence.</p><div class="fc-list sentence-list" id="sentence-list"></div><p class="fc-sentence"><span id="sentence-start"></span> <span class="fc-blank" id="sentence-blank">______</span><span id="sentence-end">.</span></p><div class="fc-actions"><button class="pill-btn blue" id="sentence-reset">Try Again</button></div></section>
      </main>
    </div>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/flashcards.js"></script>
</body>
</html>
