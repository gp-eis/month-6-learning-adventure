<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Groomer Month 🐾</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Landing-page-only styling */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      background: linear-gradient(180deg, #b7ecff 0%, #dff5ff 57%, #fff6fc 100%);
    }

    .hero {
      width: min(920px, 94vw);
      text-align: center;
      padding: 104px 20px 60px;
      position: relative;
      z-index: 2;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vw, 22px);
    }

    .title-row .title-tub {
      width: clamp(58px, 8vw, 92px);
      height: clamp(58px, 8vw, 92px);
      object-fit: contain;
      filter: drop-shadow(0 6px 5px rgba(74, 59, 82, .18));
    }

    .hero .big-title {
      font-size: clamp(2.65rem, 6.5vw, 4.25rem);
      line-height: 1.05;
      text-shadow: 3px 3px 0 var(--white), 7px 7px 0 rgba(224, 72, 127, .20);
    }

    .hero .subtitle {
      margin-top: 28px;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
    }

    .pets-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.7vw, 22px);
      margin: 18px auto 0;
      max-width: 900px;
    }

    .pet-3d {
      width: min(17.5%, 155px);
      height: 190px;
      object-fit: contain;
      filter: drop-shadow(0 8px 6px rgba(74, 59, 82, .14));
      animation: pet-bob 2.8s ease-in-out infinite;
    }

    .pet-3d:nth-child(2) { animation-delay: .25s; }
    .pet-3d:nth-child(3) { animation-delay: .5s; }
    .pet-3d:nth-child(4) { animation-delay: .75s; }
    .pet-3d:nth-child(5) { animation-delay: 1s; }

    @keyframes pet-bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }

    .menu-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
      margin-top: 22px;
    }

    .menu-buttons .big-btn {
      width: min(274px, 40vw);
      min-height: 91px;
      padding: 20px 32px;
      font-size: clamp(1.55rem, 3vw, 2rem);
    }

    .sun { display: none; }

    .cloud {
      position: fixed;
      background: var(--white);
      border-radius: 999px;
      opacity: .85;
      z-index: 1;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: var(--white);
      border-radius: 50%;
    }

    .cloud.c1 {
      top: 28px;
      left: 32%;
      width: 140px;
      height: 46px;
      transform: translateX(-50%);
    }

    .cloud.c1::before { width: 64px; height: 64px; top: -30px; left: 20px; }
    .cloud.c1::after  { width: 50px; height: 50px; top: -20px; left: 74px; }
    .cloud.c2 { display: none; }

    @media (max-width: 650px) {
      .hero { padding-top: 90px; }
      .title-row .title-tub { display: none; }
      .pets-row { gap: 2px; }
      .pet-3d { width: 19.5%; height: 130px; }
      .menu-buttons { gap: 20px; margin-top: 34px; }
      .menu-buttons .big-btn {
        width: min(330px, 86vw);
        min-height: 78px;
      }
      .cloud.c1 { left: 50%; transform: translateX(-50%) scale(.8); }
    }
    .level-week-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:26px auto 0;max-width:860px}.level-week-card{padding:18px;border:4px solid var(--white);border-radius:28px;background:rgba(255,255,255,.84);box-shadow:0 8px 0 rgba(179,136,255,.2),0 14px 24px rgba(74,59,82,.12)}.level-week-card h2{color:var(--pink-d);font-size:1.45rem}.level-week-card p{min-height:2.6em;font-family:'Fredoka',sans-serif;font-weight:600}.week-actions{display:flex;gap:10px;margin-top:13px}.week-action{flex:1;padding:11px 10px;border-radius:16px;color:#fff;font-weight:800;text-decoration:none;box-shadow:0 4px 0 rgba(74,59,82,.25)}.week-action.lesson{background:linear-gradient(var(--pink),var(--pink-d))}.week-action.games{background:linear-gradient(var(--green),var(--green-d))}@media(max-width:650px){.level-week-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <div class="floaties" aria-hidden="true">
    <span style="top:8%;  left:6%;">🐾</span>
    <span style="top:22%; left:88%;">🫧</span>
    <span style="top:55%; left:4%;">🧼</span>
    <span style="top:70%; left:92%;">🐾</span>
    <span style="top:85%; left:12%;">🫧</span>
    <span style="top:40%; left:80%;">✂️</span>
    <span style="top:90%; left:70%;">🐾</span>
  </div>

  <main class="hero">
    <div class="title-row">
      <img class="title-tub" src="assets/images/ui/bathtub-3d.png" alt="">
      <h1 class="big-title">Pet Groomer Month!</h1>
      <img class="title-tub" src="assets/images/ui/bathtub-3d.png" alt="">
    </div>
    <p class="subtitle">Let's wash, brush, and make our furry friends sparkle! ✨</p>

    <div class="pets-row">
      <img class="pet-3d" src="assets/images/ui/dog-3d.png" alt="Happy dog">
      <img class="pet-3d" src="assets/images/ui/cat-3d.png" alt="Happy cat">
      <img class="pet-3d" src="assets/images/ui/bunny-3d.png" alt="Happy bunny">
      <img class="pet-3d" src="assets/images/ui/hamster-3d.png" alt="Happy hamster">
      <img class="pet-3d" src="assets/images/ui/parrot-3d.png" alt="Happy parrot">
    </div>

    <p class="subtitle" id="selected-week-label">Week 1</p>
    <nav class="menu-buttons" aria-label="Week menu">
      <a class="big-btn btn-pink" id="week-lesson-link" href="lessons/page-01.html">📖 Lesson</a>
      <a class="big-btn btn-green" id="week-games-link" href="games/index.html?week=1">🎮 Games</a>
    </nav>
    <p style="margin-top:28px"><a class="back-link" href="weeks.html">⬅️ Choose Another Week</a></p>
  </main>

  <script>
    const selectedWeek = Math.min(4, Math.max(1, Number(new URLSearchParams(location.search).get('week')) || 1));
    document.getElementById('selected-week-label').textContent = `Week ${selectedWeek}`;
    document.getElementById('week-lesson-link').href = `lessons/page-0${selectedWeek}.html`;
    document.getElementById('week-games-link').href = `games/index.html?week=${selectedWeek}`;
  </script>
  <script src="js/main.js"></script>
</body>
</html>
