<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Do You Groom a Cat? — Pet Groomer Month</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">🐾</span>
    <span style="top:70%; left:94%;">🫧</span>
  </div>

  <div class="page">
    <a class="back-link" href="../Month 6 Level A.html?week=1">⬅️ Week 1 Menu</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title" style="font-size:2.4rem;">🐱 Week 1 — How Do You Groom a Cat?</h1>
      <nav class="week-tools" aria-label="Week tools"><a class="pill-btn blue" href="flashcards.html?week=1">&#127183; Flashcards</a></nav>
    </header>

    <!-- ============ BOOK PAGE IMAGE ============ -->
    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">📖 Book Page</h2>
      <img
        class="lesson-image"
        src="../assets/images/week-1/page-01.png"
        alt="Illustrated lesson page showing six ways to groom a cat: dry, brush, cut, stroke, and wash its fur."
      >
    </section>

    <!-- ============ 3D ANIMATED VERSION ============ -->
    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">✨ 3D Animated Version</h2>
      <video
        id="dialogue-video"
        class="lesson-video"
        controls
        preload="none"
        poster="../assets/images/week-1/page-01-3d-thumbnail.png"
        aria-label="3D animated version of How Do You Groom a Cat?"
      ></video>
    </section>

    <!-- ============ DIALOGUE BUTTONS ============ -->
    <!--
      To hook up real audio later, add:  data-audio="../assets/audio/page-01-line-1.mp3"
      To play a video instead, add:      data-video="../assets/video/week-1/page-01-line-1.mp4"
    -->
    <section class="card center" style="margin-top:24px;">
      <h2 class="section-title">💬 Tap to Hear!</h2>
      <div class="dialogue-grid">
        <button class="pill-btn" data-dialogue data-video="../assets/video/week-1/page-01-intro.mp4" data-line="How do you groom a cat?">
          <span aria-hidden="true">🎬</span> How do you groom a cat?
        </button>
        <button class="pill-btn orange" data-dialogue data-video="../assets/video/week-1/dry.mp4" data-line="I can dry its fur.">
          <span aria-hidden="true">🎬</span> I can dry its fur.
        </button>
        <button class="pill-btn blue" data-dialogue data-video="../assets/video/week-1/brush.mp4" data-line="I can brush its fur.">
          <span aria-hidden="true">🎬</span> I can brush its fur.
        </button>
        <button class="pill-btn green" data-dialogue data-video="../assets/video/week-1/cut.mp4" data-line="I can cut its fur.">
          <span aria-hidden="true">🎬</span> I can cut its fur.
        </button>
        <button class="pill-btn" data-dialogue data-video="../assets/video/week-1/stroke.mp4" data-line="I can stroke its fur.">
          <span aria-hidden="true">🎬</span> I can stroke its fur.
        </button>
        <button class="pill-btn orange" data-dialogue data-video="../assets/video/week-1/wash.mp4" data-line="I can wash its fur.">
          <span aria-hidden="true">🎬</span> I can wash its fur.
        </button>
      </div>
    </section>

    <!-- ============ PREV / NEXT ============ -->
    <nav class="page-nav">
      <span class="spacer"></span>
      <a class="pill-btn green" href="page-02.html">Next Week ➡️</a>
    </nav>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
