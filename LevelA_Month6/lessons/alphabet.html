<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Alphabet - Level A</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .alphabet-page{max-width:920px}.alphabet-header{margin-top:16px;text-align:center}.alphabet-card{margin:24px auto 0;padding:22px;border:4px solid #91d8c0;border-radius:32px;background:linear-gradient(145deg,#effff8,#fff8df);box-shadow:0 9px 0 rgba(55,167,127,.18)}
    .letter-stage{display:grid;place-items:center;width:min(100%,560px);aspect-ratio:4/3;margin:auto;border:5px solid #37a77f;border-radius:28px;background:#fff;box-shadow:inset 0 0 35px rgba(79,195,247,.15),0 10px 24px rgba(74,59,82,.14);overflow:hidden}.letter{color:var(--purple-d);font-size:clamp(9rem,34vw,18rem);font-weight:900;line-height:1;text-shadow:0 8px 0 #dfd4f6;user-select:none}.letter.is-lowercase{color:#37a77f;text-shadow:0 8px 0 #d5f5e8}
    .letter-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(100%,560px);margin:14px auto 0;color:#655a70;font-weight:900}.case-label{padding:7px 13px;border-radius:999px;background:#fff;border:2px solid #b6e8d7}.alphabet-actions{display:flex;justify-content:center;gap:14px;margin-top:18px}.alphabet-actions button{min-width:130px}.alphabet-strip{display:flex;gap:7px;margin:20px auto 0;padding:10px;overflow-x:auto;border-radius:18px;background:rgba(255,255,255,.75);scrollbar-width:thin}.strip-letter{flex:0 0 42px;height:42px;border:2px solid #d8d1ef;border-radius:12px;background:#fff;color:#665773;font-family:inherit;font-size:1.25rem;font-weight:900;cursor:pointer}.strip-letter.is-active{border-color:#37a77f;background:#dcfff1;color:#268867;transform:translateY(-2px)}
    @media(max-width:520px){.alphabet-card{padding:14px}.letter-stage{aspect-ratio:1}.alphabet-actions button{min-width:0;flex:1}.letter-meta{font-size:.9rem}}
  </style>
</head>
<body>
  <div class="page alphabet-page">
    <a class="back-link" id="alphabet-back" href="page-01.html">&#11013;&#65039; Back to Week 1</a>
    <header class="alphabet-header"><h1 class="big-title">&#128292; Alphabet</h1><p class="subtitle">Big letters and small letters, one at a time.</p></header>
    <main class="alphabet-card">
      <section class="letter-stage" aria-live="polite" aria-label="Current alphabet letter"><span class="letter" id="letter">A</span></section>
      <div class="letter-meta"><span class="case-label" id="case-label">Big letter</span><span id="letter-count">1 of 52</span></div>
      <div class="alphabet-actions"><button class="pill-btn orange" id="previous-letter" type="button">Previous</button><button class="pill-btn green" id="next-letter" type="button">Next</button></div>
      <nav class="alphabet-strip" id="alphabet-strip" aria-label="Choose an alphabet letter"></nav>
    </main>
  </div>
  <script>
    const week=Math.min(4,Math.max(1,Number(new URLSearchParams(location.search).get('week'))||1));
    const letters=[];
    for(let code=65;code<=90;code++){letters.push(String.fromCharCode(code),String.fromCharCode(code+32))}
    const back=document.getElementById('alphabet-back'),letter=document.getElementById('letter'),caseLabel=document.getElementById('case-label'),count=document.getElementById('letter-count'),strip=document.getElementById('alphabet-strip');
    back.href=`page-0${week}.html`;back.textContent=`Back to Week ${week}`;
    let current=0;
    function showLetter(index){current=(index+letters.length)%letters.length;const value=letters[current],isLower=value===value.toLowerCase();letter.textContent=value;letter.classList.toggle('is-lowercase',isLower);caseLabel.textContent=isLower?'Small letter':'Big letter';count.textContent=`${current+1} of ${letters.length}`;strip.querySelectorAll('button').forEach((button,i)=>button.classList.toggle('is-active',i===current));strip.children[current].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}
    letters.forEach((value,index)=>{const button=document.createElement('button');button.type='button';button.className='strip-letter';button.textContent=value;button.setAttribute('aria-label',`${value===value.toLowerCase()?'Small':'Big'} letter ${value.toUpperCase()}`);button.onclick=()=>showLetter(index);strip.appendChild(button)});
    document.getElementById('previous-letter').onclick=()=>showLetter(current-1);document.getElementById('next-letter').onclick=()=>showLetter(current+1);document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft')showLetter(current-1);if(event.key==='ArrowRight')showLetter(current+1)});showLetter(0);
  </script>
</body>
</html>
