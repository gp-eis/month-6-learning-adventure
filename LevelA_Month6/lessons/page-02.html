<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Heavy Is the Rain? — Pet Groomer Month</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">🌧️</span>
    <span style="top:70%; left:94%;">☂️</span>
  </div>

  <div class="page">
    <a class="back-link" href="../Month 6 Level A.html?week=2">⬅️ Week 2 Menu</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title" style="font-size:2.4rem;">🌧️ Week 2 — How Heavy Is the Rain?</h1>
      <nav class="week-tools" aria-label="Week tools"><a class="pill-btn blue" href="flashcards.html?week=2">&#127183; Flashcards</a></nav>
    </header>

    <!-- ============ BOOK PAGE IMAGE ============ -->
    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">📖 Book Page</h2>
      <img
        class="lesson-image"
        src="../assets/images/week-2/page-02.png"
        alt="Illustrated lesson page showing rain falling very lightly, lightly, heavily, and very heavily."
      >
    </section>

    <!-- ============ 3D ANIMATED VERSION ============ -->
    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">✨ 3D Animated Version</h2>
      <video
        id="dialogue-video"
        class="lesson-video"
        controls
        preload="none"
        poster="../assets/images/page-02.png"
        aria-label="3D animated version of How Heavy Is the Rain?"
      ></video>
    </section>

    <!-- ============ DIALOGUE BUTTONS ============ -->
    <!--
      To hook up real audio later, add:  data-audio="../assets/audio/page-02-line-1.mp3"
      To play a video instead, add:      data-video="../assets/video/week-2/example.mp4"
    -->
    <section class="card center" style="margin-top:24px;">
      <h2 class="section-title">💬 Tap to Hear!</h2>
      <div class="dialogue-grid">
        <button class="pill-btn" data-dialogue data-video="../assets/video/week-2/lightly.mp4" data-line="It's raining lightly.">
          <span aria-hidden="true">🎬</span> It's raining lightly.
        </button>
        <button class="pill-btn orange" data-dialogue data-video="../assets/video/week-2/very-lightly.mp4" data-line="It's raining very lightly.">
          <span aria-hidden="true">🎬</span> It's raining very lightly.
        </button>
        <button class="pill-btn blue" data-dialogue data-video="../assets/video/week-2/heavily.mp4" data-line="It's raining heavily.">
          <span aria-hidden="true">🎬</span> It's raining heavily.
        </button>
        <button class="pill-btn green" data-dialogue data-video="../assets/video/week-2/very-heavily.mp4" data-line="It's raining very heavily.">
          <span aria-hidden="true">🎬</span> It's raining very heavily.
        </button>
        <button class="pill-btn" data-dialogue data-video="../assets/video/week-2/cats-and-dogs.mp4" data-line="It's raining cats and dogs.">
          <span aria-hidden="true">🎬</span> It's raining cats and dogs.
        </button>
      </div>
    </section>

    <!-- ============ PREV / NEXT ============ -->
    <nav class="page-nav">
      <a class="pill-btn green" href="page-01.html">⬅️ Previous Week</a>
      <span class="spacer"></span>
      <a class="pill-btn green" href="page-03.html">Next Week ➡️</a>
    </nav>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
