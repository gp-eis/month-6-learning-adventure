<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Month 🌾 — Level B</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Landing-page-only styling */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      background: linear-gradient(180deg, #7ecfff 0%, #b8e8ff 42%, #c8f0a0 68%, #8fd055 100%);
    }

    /* ---- Sunny sky ---- */
    .sun {
      position: fixed;
      top: 28px;
      right: 12%;
      width: clamp(70px, 12vw, 110px);
      height: clamp(70px, 12vw, 110px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8a0, var(--sun) 55%, #f0b820);
      box-shadow: 0 0 0 12px rgba(255, 217, 61, .25),
                  0 0 60px rgba(255, 217, 61, .45);
      z-index: 1;
      animation: sun-pulse 4s ease-in-out infinite;
    }

    @keyframes sun-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    .cloud {
      position: fixed;
      background: var(--white);
      border-radius: 999px;
      opacity: .9;
      z-index: 1;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: var(--white);
      border-radius: 50%;
    }

    .cloud.c1 {
      top: 48px;
      left: 18%;
      width: 130px;
      height: 42px;
    }
    .cloud.c1::before { width: 58px; height: 58px; top: -28px; left: 18px; }
    .cloud.c1::after  { width: 46px; height: 46px; top: -18px; left: 68px; }

    .cloud.c2 {
      top: 90px;
      left: 72%;
      width: 100px;
      height: 34px;
      opacity: .75;
    }
    .cloud.c2::before { width: 44px; height: 44px; top: -22px; left: 12px; }
    .cloud.c2::after  { width: 36px; height: 36px; top: -14px; left: 52px; }

    /* ---- Rolling hills ---- */
    .hills {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 28vh;
      z-index: 0;
      pointer-events: none;
    }

    .hill {
      position: absolute;
      bottom: 0;
      border-radius: 50% 50% 0 0;
    }

    .hill-back {
      left: -10%;
      width: 120%;
      height: 22vh;
      background: #7ec840;
    }

    .hill-front {
      left: -5%;
      width: 110%;
      height: 14vh;
      background: #6ab838;
    }

    /* ---- Fence along the bottom ---- */
    .fence {
      position: fixed;
      bottom: 12vh;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: clamp(18px, 3vw, 36px);
      z-index: 1;
      pointer-events: none;
      opacity: .55;
    }

    .fence-post {
      width: clamp(8px, 1.2vw, 12px);
      height: clamp(36px, 5vw, 52px);
      background: linear-gradient(180deg, #d4a870, #a07040);
      border-radius: 4px 4px 2px 2px;
      box-shadow: 2px 2px 0 rgba(0,0,0,.12);
    }

    /* ---- Barn decoration ---- */
    .barn-deco {
      position: fixed;
      bottom: 14vh;
      left: 4%;
      width: clamp(80px, 14vw, 130px);
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 6px 8px rgba(74, 59, 82, .2));
    }

    .barn-deco svg { width: 100%; height: auto; display: block; }

    /* ---- Hero ---- */
    .hero {
      width: min(920px, 94vw);
      text-align: center;
      padding: 90px 20px 120px;
      position: relative;
      z-index: 2;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vw, 22px);
    }

    .title-row .title-icon-img {
      width: clamp(58px, 8vw, 92px);
      height: clamp(58px, 8vw, 92px);
      object-fit: contain;
      filter: drop-shadow(0 6px 5px rgba(74, 59, 82, .18));
      animation: icon-bob 2.8s ease-in-out infinite;
    }

    .title-row .title-icon-img:last-child { animation-delay: .5s; }

    @keyframes icon-bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-8px) rotate(4deg); }
    }

    .hero .big-title {
      font-size: clamp(2.65rem, 6.5vw, 4.25rem);
      line-height: 1.05;
      color: var(--barn-d);
      text-shadow: 3px 3px 0 var(--white), 7px 7px 0 rgba(196, 58, 40, .20);
    }

    .hero .subtitle {
      margin-top: 22px;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      color: var(--earth-d);
    }

    /* ---- Farm animals row ---- */
    .animals-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.7vw, 22px);
      margin: 18px auto 0;
      max-width: 900px;
    }

    .farm-animal-img {
      width: min(17.5%, 155px);
      height: 190px;
      object-fit: contain;
      filter: drop-shadow(0 8px 6px rgba(74, 59, 82, .14));
      animation: animal-bob 2.8s ease-in-out infinite;
    }

    .farm-animal-img:nth-child(2) { animation-delay: .25s; }
    .farm-animal-img:nth-child(3) { animation-delay: .5s; }
    .farm-animal-img:nth-child(4) { animation-delay: .75s; }
    .farm-animal-img:nth-child(5) { animation-delay: 1s; }

    @keyframes animal-bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50%      { transform: translateY(-8px) rotate(1deg); }
    }

    .menu-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
      margin-top: 28px;
    }

    .menu-buttons .big-btn {
      width: min(274px, 40vw);
      min-height: 91px;
      padding: 20px 32px;
      font-size: clamp(1.55rem, 3vw, 2rem);
    }

    @media (max-width: 650px) {
      .hero { padding: 80px 16px 100px; }
      .title-row .title-icon-img { display: none; }
      .animals-row { gap: 2px; }
      .farm-animal-img { width: 19.5%; height: 130px; }
      .menu-buttons { gap: 20px; margin-top: 30px; }
      .menu-buttons .big-btn {
        width: min(330px, 86vw);
        min-height: 78px;
      }
      .barn-deco { display: none; }
      .sun { right: 6%; top: 18px; }
      .cloud.c1 { left: 50%; transform: translateX(-50%) scale(.85); }
    }
    .level-week-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:26px auto 0;max-width:860px}.level-week-card{padding:18px;border:4px solid var(--white);border-radius:28px;background:rgba(255,255,255,.88);box-shadow:0 8px 0 rgba(143,98,48,.18),0 14px 24px rgba(74,59,82,.12)}.level-week-card h2{color:var(--barn-d);font-size:1.45rem}.level-week-card p{min-height:2.6em;font-family:'Fredoka',sans-serif;font-weight:600}.week-actions{display:flex;gap:10px;margin-top:13px}.week-action{flex:1;padding:11px 10px;border-radius:16px;color:#fff;font-weight:800;text-decoration:none;box-shadow:0 4px 0 rgba(74,59,82,.25)}.week-action.lesson{background:linear-gradient(var(--barn-red),var(--barn-d))}.week-action.games{background:linear-gradient(var(--grass),var(--grass-d))}@media(max-width:650px){.level-week-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <div class="sun" aria-hidden="true"></div>
  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>

  <div class="hills" aria-hidden="true">
    <div class="hill hill-back"></div>
    <div class="hill hill-front"></div>
  </div>

  <div class="fence" aria-hidden="true">
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
    <span class="fence-post"></span>
  </div>

  <div class="barn-deco" aria-hidden="true">
    <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
      <polygon points="60,8 110,45 110,92 10,92 10,45" fill="#e85d4a"/>
      <polygon points="60,8 110,45 10,45" fill="#c43a28"/>
      <rect x="42" y="58" width="36" height="34" rx="4" fill="#fff8ec"/>
      <rect x="48" y="64" width="24" height="28" rx="2" fill="#8f6230"/>
      <circle cx="68" cy="78" r="2" fill="#ffd93d"/>
      <rect x="22" y="52" width="18" height="14" rx="2" fill="#5ec8f2" opacity=".7"/>
      <rect x="80" y="52" width="18" height="14" rx="2" fill="#5ec8f2" opacity=".7"/>
    </svg>
  </div>

  <div class="floaties" aria-hidden="true">
    <span style="top:8%;  left:6%;">🌾</span>
    <span style="top:22%; left:88%;">🌻</span>
    <span style="top:55%; left:4%;">🚜</span>
    <span style="top:70%; left:92%;">🌾</span>
    <span style="top:85%; left:12%;">🐔</span>
    <span style="top:40%; left:80%;">🍎</span>
    <span style="top:90%; left:70%;">🌽</span>
  </div>

  <main class="hero">
    <div class="title-row">
      <img class="title-icon-img" src="assets/images/ui/farmer-3d.png" alt="">
      <h1 class="big-title">Farmer Month!</h1>
      <img class="title-icon-img" src="assets/images/ui/wheat-3d.png" alt="">
    </div>
    <p class="subtitle">Let's plant, grow, and harvest on the farm! 🚜✨</p>

    <div class="animals-row" aria-label="Farm friends">
      <img class="farm-animal-img" src="assets/images/ui/cow-3d.png" alt="Happy cow">
      <img class="farm-animal-img" src="assets/images/ui/chicken-3d.png" alt="Happy chicken">
      <img class="farm-animal-img" src="assets/images/ui/pig-3d.png" alt="Happy pig">
      <img class="farm-animal-img" src="assets/images/ui/sheep-3d.png" alt="Happy sheep">
      <img class="farm-animal-img" src="assets/images/ui/horse-3d.png" alt="Happy horse">
    </div>

    <p class="subtitle" id="selected-week-label">Week 1</p>
    <nav class="menu-buttons" aria-label="Week menu">
      <a class="big-btn btn-pink" id="week-lesson-link" href="lessons/page-01.html">📖 Lesson</a>
      <a class="big-btn btn-green" id="week-games-link" href="games/index.html?week=1">🎮 Games</a>
    </nav>
    <p style="margin-top:28px"><a class="back-link" href="weeks.html">⬅️ Choose Another Week</a></p>
  </main>

  <script>
    const selectedWeek = Math.min(4, Math.max(1, Number(new URLSearchParams(location.search).get('week')) || 1));
    document.getElementById('selected-week-label').textContent = `Week ${selectedWeek}`;
    document.getElementById('week-lesson-link').href = `lessons/page-0${selectedWeek}.html`;
    document.getElementById('week-games-link').href = `games/index.html?week=${selectedWeek}`;
  </script>
  <script src="js/main.js"></script>
</body>
</html>
