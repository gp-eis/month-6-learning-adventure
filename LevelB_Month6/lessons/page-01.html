<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Do You Grow? — Farmer Month</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">🌱</span>
    <span style="top:70%; left:94%;">🌾</span>
  </div>

  <div class="page">
    <a class="back-link" href="../Month 6 Level B.html?week=1">⬅️ Week 1 Menu</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title" style="font-size:2.4rem;">🌱 Week 1 — What Do You Grow?</h1>
      <nav class="week-tools" aria-label="Week tools"><a class="pill-btn blue" href="flashcards.html?week=1">&#127183; Flashcards</a><a class="pill-btn green" href="alphabet.html?week=1">&#128288; Alphabet</a></nav>
    </header>

    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">📖 Book Page</h2>
      <img
        class="lesson-image"
        src="../assets/images/week-1/page-01.png"
        alt="Farm scene showing apples, pumpkins, eggplants, cabbages, corn, and carrots with the question What do you grow?"
      >
    </section>

    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">✨ 3D Animated Version</h2>
      <video
        id="dialogue-video"
        class="lesson-video"
        controls
        preload="none"
        poster="../assets/images/week-1/page-01-3d-thumbnail.png"
        aria-label="3D animated version of What Do You Grow?"
      ></video>
    </section>

    <section class="card center" style="margin-top:24px;">
      <h2 class="section-title">💬 Tap to Hear!</h2>
      <div class="dialogue-grid">
        <button class="pill-btn" data-dialogue data-video="../assets/video/week-1/corn.mp4" data-line="I grow corn.">
          <span aria-hidden="true">🎬</span> Corn
        </button>
        <button class="pill-btn orange" data-dialogue data-video="../assets/video/week-1/apples.mp4" data-line="I grow apples.">
          <span aria-hidden="true">🎬</span> Apples
        </button>
        <button class="pill-btn blue" data-dialogue data-video="../assets/video/week-1/pumpkins.mp4" data-line="I grow pumpkins.">
          <span aria-hidden="true">🎬</span> Pumpkins
        </button>
        <button class="pill-btn green" data-dialogue data-video="../assets/video/week-1/cabbages.mp4" data-line="I grow cabbages.">
          <span aria-hidden="true">🎬</span> Cabbages
        </button>
        <button class="pill-btn" data-dialogue data-video="../assets/video/week-1/carrots.mp4" data-line="I grow carrots.">
          <span aria-hidden="true">🎬</span> Carrots
        </button>
        <button class="pill-btn orange" data-dialogue data-video="../assets/video/week-1/eggplants.mp4" data-line="I grow eggplants.">
          <span aria-hidden="true">🎬</span> Eggplants
        </button>
        <button class="pill-btn red" data-dialogue data-video="../assets/video/week-1/key%20sentence.mp4" data-line="What do you grow?">
          <span aria-hidden="true">🎬</span> Key sentence
        </button>
      </div>
    </section>

    <nav class="page-nav">
      <span class="spacer"></span>
      <a class="pill-btn green" href="page-02.html">Next Week ➡️</a>
    </nav>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
