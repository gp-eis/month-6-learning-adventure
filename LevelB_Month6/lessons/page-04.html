<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It's Time to Wake Up! — Farmer Month</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="floaties" aria-hidden="true">
    <span style="top:12%; left:4%;">🌅</span>
    <span style="top:70%; left:94%;">🌙</span>
  </div>

  <div class="page">
    <a class="back-link" href="../Month 6 Level B.html?week=4">⬅️ Week 4 Menu</a>

    <header class="center" style="margin-top:16px;">
      <h1 class="big-title" style="font-size:2.4rem;">🌅 Week 4 — It's Time to Wake Up!</h1>
      <nav class="week-tools" aria-label="Week tools"><a class="pill-btn blue" href="flashcards.html?week=4">&#127183; Flashcards</a></nav>
    </header>

    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">📖 Book Page</h2>
      <img
        class="lesson-image"
        src="../assets/images/week-4/page-04.png"
        alt="Morning and night farm routines showing wake up, breakfast, work, sunset, dinner, story time, and sleep."
      >
    </section>

    <section class="card" style="margin-top:24px;">
      <h2 class="section-title">✨ 3D Animated Version</h2>
      <video
        id="dialogue-video"
        class="lesson-video"
        controls
        preload="none"
        poster="../assets/images/week-4/page-04-3d-thumbnail.png"
        aria-label="3D animated version of It's Time to Wake Up!"
      ></video>
    </section>

    <section class="card center" style="margin-top:24px;">
      <h2 class="section-title">💬 Tap to Hear!</h2>
      <div class="dialogue-grid">
        <button class="pill-btn red" data-dialogue data-line="It's time to wake up!">
          <span aria-hidden="true">🔊</span> It's time to wake up!
        </button>
        <button class="pill-btn orange" data-dialogue data-line="Good morning!">
          <span aria-hidden="true">🔊</span> Good morning!
        </button>
        <button class="pill-btn blue" data-dialogue data-line="It's time to sleep!">
          <span aria-hidden="true">🔊</span> It's time to sleep!
        </button>
        <button class="pill-btn green" data-dialogue data-line="Plant today. Harvest tomorrow.">
          <span aria-hidden="true">🔊</span> Plant today. Harvest tomorrow.
        </button>
      </div>
    </section>

    <nav class="page-nav">
      <a class="pill-btn blue" href="page-03.html">⬅️ Week 3</a>
      <span class="spacer"></span>
    </nav>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
