  <style>
    :root{--ink:#3f3a62}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:#eefaff}.launcher{min-height:100svh;display:grid;place-items:center;overflow:hidden;position:relative;padding:34px 20px;background:linear-gradient(155deg,#e8f8ff 0%,#fff8db 50%,#ffeafa 100%)}.launcher:before,.launcher:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;opacity:.38}.launcher:before{background:#a9e7ff;left:-120px;top:-110px}.launcher:after{background:#ffc4df;right:-100px;bottom:-120px}.card{position:relative;z-index:1;width:min(900px,96vw);text-align:center;padding:clamp(28px,5vw,60px);border:5px solid #fff;border-radius:44px;background:rgba(255,255,255,.84);box-shadow:0 22px 50px rgba(63,58,98,.16),0 9px 0 rgba(93,200,243,.28)}.eyebrow{display:inline-block;padding:8px 18px;border-radius:999px;background:#fff2a8;font-weight:900;letter-spacing:.06em}h1{margin:16px 0 8px;font-size:clamp(2.5rem,7vw,5rem);line-height:1;color:#6352b8;text-shadow:3px 3px #fff,7px 7px rgba(255,121,173,.18)}.intro{margin:0 auto 30px;max-width:680px;font-size:clamp(1.05rem,2vw,1.3rem);font-weight:700;color:#696183}.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.subject{display:grid;place-items:center;min-height:275px;padding:28px 20px;border-radius:34px;color:var(--ink);text-decoration:none;box-shadow:0 10px 0 var(--shadow),0 16px 25px rgba(63,58,98,.14);transition:transform .16s}.subject:hover{transform:translateY(-7px) rotate(-1deg)}.english{background:linear-gradient(160deg,#e6f8ff,#a9e5fb);--shadow:#55acd0}.math{background:linear-gradient(160deg,#fff2c2,#ffc96b);--shadow:#e89a32}.icon{display:grid;place-items:center;width:104px;height:104px;margin:0 auto 14px;border-radius:32px;background:rgba(255,255,255,.76);font-size:3.4rem}.subject strong{display:block;font-size:clamp(1.8rem,4vw,2.5rem)}.subject small{display:block;margin-top:8px;font-size:1rem;font-weight:800;line-height:1.4}@media(max-width:680px){.subjects{grid-template-columns:1fr}.subject{min-height:200px}.card{border-radius:30px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
