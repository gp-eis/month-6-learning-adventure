<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level B Week 3 Games</title><link rel="stylesheet" href="../../game-suite.css"><style>
.object-row{display:flex;justify-content:center;align-items:end;gap:18px;flex-wrap:wrap}.object-card{display:grid;place-items:center;min-width:165px;padding:12px;border:4px solid #d9ead7;border-radius:25px;background:#fff;box-shadow:0 6px 0 #a9cba4}.art{width:135px;height:135px;object-fit:contain}.answer-art{display:block;width:92px;height:92px;margin:auto;object-fit:contain}.object-card strong{font-size:1rem}.garden-scale{display:flex;align-items:center;justify-content:center;gap:6px;min-width:min(650px,92vw)}.garden-pan{display:grid;place-items:center;width:200px;min-height:145px;border-bottom:12px solid #55a66a;border-radius:22px;background:#fff;box-shadow:0 5px 0 #a7d0ae}.garden-pan .art{width:130px;height:130px}.garden-pan.down{transform:translateY(25px)}.garden-pan.up{transform:translateY(-20px)}.scale-post{font-size:4rem}.number-scene{display:grid;gap:14px;width:min(760px,96%);padding:20px;border:5px solid #fff;border-radius:26px;background:#f0fbff;box-shadow:0 7px 0 #acd2e4}.jump-instruction{padding:8px;border-radius:15px;background:#fff4b7;font-size:1.15rem;font-weight:900}.bar-wrap{overflow-x:auto;padding:8px}.jump-row,.number-bar{display:grid;grid-template-columns:repeat(10,minmax(52px,1fr));min-width:560px}.jump-space{height:56px;display:grid;place-items:center;color:#dc6f45;font-size:2.2rem;font-weight:900}.jump-space.hop{border-top:5px dashed #e88955;border-radius:50% 50% 0 0;animation:hop .55s ease both}.jump-space.hop:nth-child(2n){animation-delay:.18s}.jump-space.hop:nth-child(3n){animation-delay:.36s}.bar-number{position:relative;padding:14px 4px;border:3px solid #477fad;border-right:0;background:#fff;font-size:1.45rem;font-weight:900}.bar-number:last-child{border-right:3px solid #477fad}.bar-number.start{background:#ffe578;color:#7c5e00;box-shadow:inset 0 0 0 4px #f4bd31}.bar-number.landed{background:#bcecae;color:#226c27;box-shadow:inset 0 0 0 4px #62b866}.bar-number.jumped:not(.landed){background:#ddf4d6}.bar-labels{display:flex;justify-content:space-between;gap:15px;font-weight:900}.start-label{color:#9b7100}.end-label{color:#287c31}.equation{font-size:2rem;font-weight:900;color:#477fad}.number-choice{display:grid;place-items:center;width:78px;height:78px;margin:auto;border-radius:50%;background:#fff;color:#3978b4;font-size:2.3rem;box-shadow:0 4px 0 #9ac6df}@keyframes hop{0%{transform:translateY(12px);opacity:.2}60%{transform:translateY(-8px)}100%{transform:none;opacity:1}}@media(max-width:620px){.garden-pan{width:125px;min-height:105px}.garden-pan .art{width:92px;height:92px}.scale-post{font-size:3rem}}
</style></head><body><main class="suite"><div class="topbar"><a class="back" href="index.html">&#8592; Week 3</a><span class="score">&#11088; <span id="stars">0</span></span></div><section id="menu-screen"><h1 class="suite-title" id="suite-title"></h1><p class="subtitle" id="subtitle"></p><div class="game-menu" id="game-menu"></div></section><section id="play-screen" hidden><h1 class="suite-title">Garden Games!</h1><div class="play-card"><span class="mode-label" id="mode-label"></span><p class="prompt" id="prompt"></p><div class="scene" id="scene"></div><div class="answers" id="answers"></div><p class="message" id="message" aria-live="polite"></p><div class="controls"><button class="menu-btn" id="menu-from-play">All Games</button><button class="next" id="next" hidden>Next &#10145;</button></div></div></section><section class="finish" id="finish" hidden><div class="finish-icon">&#127881;&#127942;</div><h1 id="finish-title"></h1><p class="subtitle">You earned <strong><span id="final-stars"></span> stars!</strong></p><div class="controls"><button class="menu-btn" id="menu-from-finish">All Games</button><button class="again" id="again">Play Again</button></div></section></main><script>
const artPath='../../assets/games/week3-shared/';const names={can:'Watering can',flower:'Flower',pot:'Pot of soil'};const files={can:'watering-can',flower:'flower',pot:'soil-pot'};const art=(key,css='art')=>`<img class="${css}" src="${artPath}${files[key]}.png" alt="${names[key]}">`;const answer=key=>art(key,'answer-art');
const objects=keys=>`<div class="object-row">${keys.map(key=>`<div class="object-card">${art(key)}<strong>${names[key]}</strong></div>`).join('')}</div>`;
const scale=(left,right,heavy)=>`<div class="garden-scale"><div class="garden-pan ${heavy==='left'?'down':'up'}">${art(left)}</div><div class="scale-post">&#9878;&#65039;</div><div class="garden-pan ${heavy==='right'?'down':'up'}">${art(right)}</div></div>`;
const numberPic=n=>`<span class="number-choice">${n}</span>`;const countScene=(start,add)=>{const end=start+add;const jumps=Array.from({length:10},(_,i)=>{const n=i+1;return `<span class="jump-space ${n>start&&n<=end?'hop':''}">${n>start&&n<=end?'↷':''}</span>`}).join('');const numbers=Array.from({length:10},(_,i)=>{const n=i+1;const classes=[n===start?'start':'',n>start&&n<=end?'jumped':'',n===end?'landed':''].join(' ');return `<span class="bar-number ${classes}">${n}</span>`}).join('');return `<div class="number-scene"><div class="jump-instruction">Find ${start}. Then make ${add} jumps to the right.</div><div class="bar-wrap"><div class="jump-row">${jumps}</div><div class="number-bar">${numbers}</div></div><div class="bar-labels"><span class="start-label">Start at ${start}</span><span class="end-label">Land on ?</span></div><div class="equation">${start} + ${add} = ?</div></div>`};
const GAME_CONFIG={title:'Level B Garden Lab!',subtitle:'Three visual games about object weight and counting on',good:['Great garden thinking! ⭐','Wonderful! 🌟','You got it! 🎉'],tryAgain:'Look carefully and try another picture. 💛',games:[
{title:'Garden Weight',icon:'🌱',image:`${artPath}watering-can.png`,hint:'Use the balance to find the heavy or light object.',color:'#e0f5d6',shadow:'#7eb66d',rounds:[{prompt:'Look at the balance. Which object is HEAVY?',scene:scale('can','flower','left'),answers:[{pic:answer('can'),label:'Watering can'},{pic:answer('flower'),label:'Flower'}],correct:0},{prompt:'The higher object is light. Which object is LIGHT?',scene:scale('pot','flower','left'),answers:[{pic:answer('pot'),label:'Pot of soil'},{pic:answer('flower'),label:'Flower'}],correct:1},{prompt:'The lower object is heavier. Which object is HEAVIER?',scene:scale('can','pot','left'),answers:[{pic:answer('can'),label:'Full watering can'},{pic:answer('pot'),label:'Pot of soil'}],correct:0},{prompt:'The higher object is lighter. Which object is LIGHTER?',scene:scale('flower','can','right'),answers:[{pic:answer('flower'),label:'Flower'},{pic:answer('can'),label:'Watering can'}],correct:0}]},
{title:'Balance Detective',icon:'⚖️',image:`${artPath}flower.png`,hint:'The heavier side moves down.',color:'#fff0bd',shadow:'#dda945',rounds:[{prompt:'Which side is HEAVIER?',scene:scale('can','flower','left'),answers:[{pic:answer('can'),label:'Watering can'},{pic:answer('flower'),label:'Flower'}],correct:0},{prompt:'Which side is LIGHTER?',scene:scale('pot','flower','left'),answers:[{pic:answer('pot'),label:'Pot of soil'},{pic:answer('flower'),label:'Flower'}],correct:1},{prompt:'Which object makes its side go DOWN?',scene:scale('flower','can','right'),answers:[{pic:answer('flower'),label:'Flower'},{pic:answer('can'),label:'Watering can'}],correct:1},{prompt:'Which object is higher and LIGHTER?',scene:scale('pot','flower','left'),answers:[{pic:answer('pot'),label:'Pot of soil'},{pic:answer('flower'),label:'Flower'}],correct:1}]},
{title:'Number Bar Jumps',icon:'🔢',image:`${artPath}soil-pot.png`,hint:'Find the first number, then jump right to add.',color:'#dff4ff',shadow:'#76b9dd',rounds:[{prompt:'Find 2. Make 6 jumps. Where do you land?',scene:countScene(2,6),answers:[{pic:numberPic(7),label:'Seven'},{pic:numberPic(8),label:'Eight'},{pic:numberPic(9),label:'Nine'}],correct:1},{prompt:'Find 5. Make 2 jumps: six, then seven. Where do you land?',scene:countScene(5,2),answers:[{pic:numberPic(6),label:'Six'},{pic:numberPic(7),label:'Seven'},{pic:numberPic(8),label:'Eight'}],correct:1},{prompt:'Find 5. Make 4 jumps. Where do you land?',scene:countScene(5,4),answers:[{pic:numberPic(8),label:'Eight'},{pic:numberPic(9),label:'Nine'},{pic:numberPic(10),label:'Ten'}],correct:1},{prompt:'Find 6. Make 4 jumps. Where do you land?',scene:countScene(6,4),answers:[{pic:numberPic(8),label:'Eight'},{pic:numberPic(9),label:'Nine'},{pic:numberPic(10),label:'Ten'}],correct:2}]}
]};
</script><script src="../../game-suite.js"></script></body></html>
