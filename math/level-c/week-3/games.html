<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level C Week 3 Games</title><link rel="stylesheet" href="../../game-suite.css"><style>
.weight-work{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}.weight-card{display:grid;place-items:center;min-width:175px;padding:12px;border:4px solid #dce7ef;border-radius:25px;background:#fff;box-shadow:0 6px 0 #b7cad8}.art{width:130px;height:130px;object-fit:contain}.answer-art{display:block;width:88px;height:88px;margin:auto;object-fit:contain}.weight-badge{min-width:95px;padding:7px 12px;border:4px solid #52616a;border-radius:12px;background:#e8f1b9;color:#24321d;font:900 1.4rem monospace}.math-sign{font-size:3rem;font-weight:900;color:#ee6a59}.number-choice{display:grid;place-items:center;min-width:90px;height:76px;margin:auto;padding:0 10px;border-radius:20px;background:#fff;color:#427bb7;font-size:2rem;font-weight:900;box-shadow:0 4px 0 #9fc8df}.target-scale{display:grid;place-items:center;min-width:260px;padding:16px;border:5px solid #fff;border-radius:28px;background:#eefaff;box-shadow:0 8px 0 #a9cbdc}.target-scale .art{width:155px;height:155px}.target-display{min-width:150px;padding:10px;border:7px solid #52616a;border-radius:14px;background:#e8f1b9;font:900 2rem monospace}.pair-choice{display:flex;justify-content:center;align-items:center;gap:5px}.pair-choice img{width:52px;height:52px;object-fit:contain}.pair-choice b{padding:5px 7px;border-radius:9px;background:#fff;font-size:1rem}.pin-board{display:flex;justify-content:center;align-items:center;align-content:center;flex-wrap:wrap;max-width:720px;padding:18px;border:5px solid #fff;border-radius:28px;background:#f6fbff;box-shadow:0 7px 0 #b4d1df}.pin{position:relative;display:grid;place-items:center;width:54px;height:68px;margin:3px;border-radius:13px}.pin img{width:50px;height:50px;object-fit:contain}.pin.first-ten{background:#ffe0e5;box-shadow:inset 0 0 0 3px #ef6070}.pin.crossed{opacity:.45}.pin.crossed:after{content:'×';position:absolute;color:#ed263f;font-size:4rem;font-weight:900;line-height:1}.pin-note{flex-basis:100%;padding:7px;font-weight:900;color:#ba3447}.equation{flex-basis:100%;margin-top:10px;font-size:2rem;font-weight:900;color:#4e79aa}@media(max-width:620px){.art{width:105px;height:105px}.weight-card{min-width:135px}.pin{width:42px;height:52px}.pin img{width:39px;height:39px}}
</style></head><body><main class="suite"><div class="topbar"><a class="back" href="index.html">&#8592; Week 3</a><span class="score">&#11088; <span id="stars">0</span></span></div><section id="menu-screen"><h1 class="suite-title" id="suite-title"></h1><p class="subtitle" id="subtitle"></p><div class="game-menu" id="game-menu"></div></section><section id="play-screen" hidden><h1 class="suite-title">Weight Workshop!</h1><div class="play-card"><span class="mode-label" id="mode-label"></span><p class="prompt" id="prompt"></p><div class="scene" id="scene"></div><div class="answers" id="answers"></div><p class="message" id="message" aria-live="polite"></p><div class="controls"><button class="menu-btn" id="menu-from-play">All Games</button><button class="next" id="next" hidden>Next &#10145;</button></div></div></section><section class="finish" id="finish" hidden><div class="finish-icon">&#127881;&#127942;</div><h1 id="finish-title"></h1><p class="subtitle">You earned <strong><span id="final-stars"></span> stars!</strong></p><div class="controls"><button class="menu-btn" id="menu-from-finish">All Games</button><button class="again" id="again">Play Again</button></div></section></main><script>
const artPath='../../assets/games/week3-shared/';const labels={tomato:'Tomato basket',apple:'Apple bag',blocks:'Blocks',pin:'Pin'};const files={tomato:'tomato-basket',apple:'apple-bag',blocks:'blocks',pin:'paperclip'};const art=(key,css='art')=>`<img class="${css}" src="${artPath}${files[key]}.png" alt="${labels[key]}">`;const numberPic=text=>`<span class="number-choice">${text}</span>`;
const weightPair=(key,left,right,unit)=>`<div class="weight-work"><div class="weight-card">${art(key)}<span class="weight-badge">${left} ${unit}</span></div><span class="math-sign">+</span><div class="weight-card">${art(key)}<span class="weight-badge">${right} ${unit}</span></div></div>`;
const targetScene=(key,total,unit)=>`<div class="target-scale">${art(key)}<span class="target-display">${total} ${unit}</span><strong>Make this total!</strong></div>`;const pairPic=(key,a,b,unit)=>`<span class="pair-choice">${art(key)}<b>${a} ${unit}</b><span>+</span>${art(key)}<b>${b} ${unit}</b></span>`;
const pinScene=(big,take)=>`<div class="pin-board"><div class="pin-note">The pink group shows the first 10 pins.</div>${Array.from({length:big},(_,i)=>`<span class="pin ${i<10?'first-ten':''} ${i<take?'crossed':''}">${art('pin')}</span>`).join('')}<div class="equation">${big} − ${take} = ?</div></div>`;
const GAME_CONFIG={title:'Level C Weight Workshop!',subtitle:'Three visual games for putting together, breaking apart, and borrowing',good:['Excellent Math! ⭐','Great calculating! 🌟','You solved it! 🎉'],tryAgain:'Look at the weights or count the pins again. 💛',games:[
{title:'Put Weights Together',icon:'➕',image:`${artPath}tomato-basket.png`,hint:'Add two pictured weights.',color:'#e0f5d6',shadow:'#7eb66d',rounds:[{prompt:'What is their total weight?',scene:weightPair('tomato',300,700,'g'),answers:[{pic:numberPic('900 g'),label:'900 grams'},{pic:numberPic('1000 g'),label:'1000 grams'},{pic:numberPic('1100 g'),label:'1100 grams'}],correct:1},{prompt:'Put the apple-bag weights together.',scene:weightPair('apple',4,3,'kg'),answers:[{pic:numberPic('6 kg'),label:'6 kilograms'},{pic:numberPic('7 kg'),label:'7 kilograms'},{pic:numberPic('8 kg'),label:'8 kilograms'}],correct:1},{prompt:'What is their total weight?',scene:weightPair('apple',1,7,'kg'),answers:[{pic:numberPic('7 kg'),label:'7 kilograms'},{pic:numberPic('8 kg'),label:'8 kilograms'},{pic:numberPic('9 kg'),label:'9 kilograms'}],correct:1},{prompt:'Add both groups of blocks.',scene:weightPair('blocks',6,5,'g'),answers:[{pic:numberPic('10 g'),label:'10 grams'},{pic:numberPic('11 g'),label:'11 grams'},{pic:numberPic('12 g'),label:'12 grams'}],correct:1}]},
{title:'Make the Total',icon:'⚖️',image:`${artPath}blocks.png`,hint:'Choose two pictured weights that add to the target.',color:'#fff0bd',shadow:'#dda945',rounds:[{prompt:'Which two tomato weights make 500 grams?',scene:targetScene('tomato',500,'g'),answers:[{pic:pairPic('tomato',100,300,'g'),label:'100 plus 300'},{pic:pairPic('tomato',100,400,'g'),label:'100 plus 400'},{pic:pairPic('tomato',200,400,'g'),label:'200 plus 400'}],correct:1},{prompt:'Which two tomato weights make 700 grams?',scene:targetScene('tomato',700,'g'),answers:[{pic:pairPic('tomato',100,500,'g'),label:'100 plus 500'},{pic:pairPic('tomato',200,500,'g'),label:'200 plus 500'},{pic:pairPic('tomato',300,500,'g'),label:'300 plus 500'}],correct:1},{prompt:'Which two apple-bag weights make 8 kilograms?',scene:targetScene('apple',8,'kg'),answers:[{pic:pairPic('apple',2,5,'kg'),label:'2 plus 5'},{pic:pairPic('apple',3,5,'kg'),label:'3 plus 5'},{pic:pairPic('apple',4,5,'kg'),label:'4 plus 5'}],correct:1},{prompt:'Which two apple-bag weights make 11 kilograms?',scene:targetScene('apple',11,'kg'),answers:[{pic:pairPic('apple',4,6,'kg'),label:'4 plus 6'},{pic:pairPic('apple',5,6,'kg'),label:'5 plus 6'},{pic:pairPic('apple',6,6,'kg'),label:'6 plus 6'}],correct:1}]},
{title:'Borrowing Pins',icon:'📎',image:`${artPath}paperclip.png`,hint:'See the first ten, count crossed pins, then count what remains.',color:'#dff4ff',shadow:'#76b9dd',rounds:[{prompt:'Ten pins are crossed out. How many pins remain?',scene:pinScene(14,10),answers:[{pic:numberPic('3'),label:'Three'},{pic:numberPic('4'),label:'Four'},{pic:numberPic('5'),label:'Five'}],correct:1},{prompt:'Nine pins are crossed out. One pin in the first ten stays. How many remain?',scene:pinScene(17,9),answers:[{pic:numberPic('7'),label:'Seven'},{pic:numberPic('8'),label:'Eight'},{pic:numberPic('9'),label:'Nine'}],correct:1},{prompt:'Twelve pins are crossed out: the first ten and two more. How many remain?',scene:pinScene(19,12),answers:[{pic:numberPic('6'),label:'Six'},{pic:numberPic('7'),label:'Seven'},{pic:numberPic('8'),label:'Eight'}],correct:1},{prompt:'Eleven pins are crossed out: the first ten and one more. How many remain?',scene:pinScene(20,11),answers:[{pic:numberPic('8'),label:'Eight'},{pic:numberPic('9'),label:'Nine'},{pic:numberPic('10'),label:'Ten'}],correct:1}]}
]};
</script><script src="../../game-suite.js"></script></body></html>
