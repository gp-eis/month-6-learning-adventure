<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level C Week 1 Games</title><link rel="stylesheet" href="../../game-suite.css"><link rel="stylesheet" href="../../game-art.css"><style>
.mode{margin-top:25px;padding:25px;border:6px solid #fff;border-radius:36px;background:#ffffffdf;box-shadow:0 10px 0 #8bb7db}.mode[hidden],#menu[hidden]{display:none}.mode-head{display:flex;justify-content:space-between;align-items:center}.mode-head h2{color:#5788c5}.small-btn,.action{border:0;border-radius:999px;padding:12px 20px;font-weight:900;cursor:pointer}.small-btn{background:#ddd1ff;box-shadow:0 5px 0 #aa94df}.action{background:#ffcf55;box-shadow:0 5px 0 #d49a25}.object-row,.answers{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:20px 0}.object-card{display:grid;place-items:center;min-width:160px;padding:14px;border:4px solid #d4e5f2;border-radius:25px;background:#fff}.object-card .pic{font-size:4.7rem}.object-card .grams{padding:5px 12px;border-radius:10px;background:#e8f4c7;font-size:1.25rem;font-weight:900;white-space:nowrap}.answer{min-width:145px;min-height:85px;border:0;border-radius:22px;background:#c9ebff;font-size:1.15rem;font-weight:900;box-shadow:0 6px 0 #79b7d8}.answer.correct{background:#b9efa9}.feedback{min-height:2em;font-size:1.25rem;font-weight:900}.scale-layout{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}.supply-bank{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.supply{padding:10px;border:4px solid #fff;border-radius:20px;background:#eef8ff;box-shadow:0 6px 0 #aac8dc;cursor:grab}.supply .pic{display:block;font-size:3.5rem}.supply .grams{font-weight:900}.mission{grid-column:1/-1;padding:10px;border-radius:18px;background:#fff3b6;font-weight:900}.scale-zone{min-height:360px;padding:18px;border:5px dashed #6da4c8;border-radius:30px;background:#e8f8ff}.scale-zone.dragover{background:#d7ffd5}.display{display:inline-block;min-width:160px;padding:12px;border:8px solid #3f5060;border-radius:16px;background:#dff0a8;font:900 2rem monospace;white-space:nowrap}.tray{display:flex;align-items:end;justify-content:center;gap:7px;min-height:130px;border-bottom:16px solid #7795a9}.on-scale{font-size:3.8rem;cursor:pointer}.scale-base{width:55%;height:75px;margin:auto;background:#829dac;clip-path:polygon(35% 0,65% 0,90% 100%,10% 100%)}.pin-board{display:flex;justify-content:center;flex-wrap:wrap;max-width:720px;margin:20px auto}.pin{display:grid;place-items:center;width:38px;height:58px;margin:4px;border:3px solid #888;border-radius:17px;background:#fff;font-size:1.8rem}.pin.first-ten{border-color:#ef4050;background:#ffe0e5;box-shadow:0 0 0 3px #ffabb5}.pin.scratched{opacity:.28;position:relative}.pin.scratched:after{content:'╱';position:absolute;color:red;font-size:3rem}.pin-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.pin-actions button:disabled{opacity:.4}.result-choices{display:flex;justify-content:center;gap:12px;margin:15px}.result-choices button{min-width:80px;padding:13px;border:0;border-radius:18px;background:#d9ccff;font-size:1.3rem;font-weight:900}@media(max-width:720px){.scale-layout{grid-template-columns:1fr}.mode-head{align-items:flex-start}.object-card{min-width:130px}}
</style></head><body><main class="suite"><div class="topbar"><a class="back" href="index.html">&#8592; Week 1</a><span class="score">⭐ <span id="stars">0</span></span></div><section id="menu"><h1 class="suite-title">Grams Game Lab!</h1><p class="subtitle">Three visual games based on the Week 1 lesson.</p><div class="game-menu"><button class="game-card" data-open="detective" style="--bg:#dcefff;--shadow:#78acd5"><img class="game-art" src="../../assets/games/level-c-week1-gram-detective.png" alt="Classroom objects on scales"><strong>Gram Detective</strong><small>Read and compare weights in grams.</small></button><button class="game-card" data-open="scale" style="--bg:#e4f7d8;--shadow:#82b765"><img class="game-art" src="../../assets/games/level-c-week1-build-weight.png" alt="School supplies around a scale"><strong>Build the Weight</strong><small>Put supplies on the scale and add.</small></button><button class="game-card" data-open="pins" style="--bg:#fff0c2;--shadow:#d6aa47"><img class="game-art" src="../../assets/games/level-c-week1-pin-subtraction.png" alt="Paperclips grouped for subtraction"><strong>Pin Subtraction</strong><small>Highlight ten, scratch pins, and count.</small></button></div></section>
<section class="mode" id="detective" hidden><div class="mode-head"><button class="small-btn all-games">&#8592; All Games</button><h2>🔎 Gram Detective</h2></div><p class="prompt" id="d-prompt"></p><div class="object-row" id="d-objects"></div><div class="answers" id="d-answers"></div><p class="feedback" id="d-feedback"></p><button class="action" id="d-next" hidden>Next &#10145;</button></section>
<section class="mode" id="scale" hidden><div class="mode-head"><button class="small-btn all-games">&#8592; All Games</button><h2>⚖️ Build the Weight</h2></div><p>Drag or tap up to three supplies onto the scale.</p><div class="scale-layout"><div class="supply-bank" id="bank"><div class="mission">Mission: Make <span id="target">13</span> g</div></div><div class="scale-zone" id="scale-zone"><div class="display"><span id="total">0</span> g</div><div class="tray" id="tray"></div><div class="scale-base"></div><p class="feedback" id="scale-feedback">The scale is empty.</p><button class="action" id="clear">Clear</button> <button class="action" id="new-mission">New Mission</button></div></div></section>
<section class="mode" id="pins" hidden><div class="mode-head"><button class="small-btn all-games">&#8592; All Games</button><h2>📎 Pin Subtraction</h2></div><div class="prompt"><span id="big">14</span> − <span id="take">8</span> = ?</div><p class="mission" id="pin-instruction"></p><div class="pin-board" id="pin-board"></div><div class="pin-actions"><button class="action" id="highlight">Highlight First 10</button><button class="action" id="scratch" disabled>Scratch Pins</button></div><div class="result-choices" id="pin-results"></div><p class="feedback" id="pin-feedback"></p><button class="action" id="pin-next" hidden>Next Problem &#10145;</button></section></main><script>
const $=id=>document.getElementById(id);let stars=0;function star(){stars++;$('stars').textContent=stars}function tone(ok){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:220;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.start();o.stop(c.currentTime+.2)}function openMode(id){$('menu').hidden=true;document.querySelectorAll('.mode').forEach(x=>x.hidden=x.id!==id);if(id==='detective')showDetective();if(id==='scale')renderBank();if(id==='pins')showPins()}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMode(b.dataset.open));document.querySelectorAll('.all-games').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.hidden=true);$('menu').hidden=false});
const items={clip:['📎','Paperclip',1],pencil:['✏️','Pencil',3],crayon:['🖍️','Crayon',5],marker:['🖊️','Marker',10]};const rounds=[{q:'Which object weighs 1 gram?',ok:'clip'},{q:'Which object is the heaviest?',ok:'marker'},{q:'Which object weighs 5 grams?',ok:'crayon'},{q:'Which object is lighter than the crayon?',ok:'pencil'},{q:'Which object weighs 10 grams?',ok:'marker'}];let ri=0;function showDetective(){const r=rounds[ri];$('d-prompt').textContent=r.q;$('d-feedback').textContent='';$('d-next').hidden=true;$('d-objects').innerHTML='';$('d-answers').innerHTML='';Object.entries(items).forEach(([key,x])=>{$('d-objects').insertAdjacentHTML('beforeend',`<div class="object-card"><span class="pic">${x[0]}</span><strong>${x[1]}</strong><span class="grams">${x[2]} g</span></div>`);const b=document.createElement('button');b.className='answer';b.textContent=`${x[0]} ${x[1]}`;b.onclick=()=>{if(key===r.ok){b.classList.add('correct');$('d-feedback').textContent='Correct! ⭐';star();tone(true);$('d-next').hidden=false}else{$('d-feedback').textContent='Look at the gram labels and try again.';tone(false)}};$('d-answers').appendChild(b)})}$('d-next').onclick=()=>{ri=(ri+1)%rounds.length;showDetective()};
const supplies=Object.values(items),missions=[6,8,11,13,15,18],placed=[];let mission=13;function renderBank(){$('bank').querySelectorAll('.supply').forEach(x=>x.remove());supplies.forEach((x,i)=>{const b=document.createElement('button');b.className='supply';b.draggable=true;b.innerHTML=`<span class="pic">${x[0]}</span><strong>${x[1]}</strong><span class="grams">${x[2]} g</span>`;b.ondragstart=e=>e.dataTransfer.setData('text/plain',i);b.onclick=()=>addSupply(i);$('bank').appendChild(b)});updateScale()}function addSupply(i){if(placed.length>=3){$('scale-feedback').textContent='The scale can hold three objects. Clear it first!';return}placed.push(i);updateScale()}function updateScale(){const total=placed.reduce((sum,i)=>sum+supplies[i][2],0);$('total').textContent=total;$('tray').innerHTML=placed.map((i,p)=>`<span class="on-scale" data-pos="${p}">${supplies[i][0]}</span>`).join('');document.querySelectorAll('.on-scale').forEach(x=>x.onclick=()=>{placed.splice(+x.dataset.pos,1);updateScale()});if(!placed.length)$('scale-feedback').textContent='The scale is empty.';else if(total===mission){$('scale-feedback').textContent=`You made ${mission} g! ⭐`;star();tone(true)}else $('scale-feedback').textContent=`Current total: ${total} g`}$('scale-zone').ondragover=e=>{e.preventDefault();$('scale-zone').classList.add('dragover')};$('scale-zone').ondragleave=()=>$('scale-zone').classList.remove('dragover');$('scale-zone').ondrop=e=>{e.preventDefault();$('scale-zone').classList.remove('dragover');addSupply(+e.dataTransfer.getData('text/plain'))};$('clear').onclick=()=>{placed.length=0;updateScale()};$('new-mission').onclick=()=>{mission=missions[Math.floor(Math.random()*missions.length)];$('target').textContent=mission;placed.length=0;updateScale()};
const pinProblems=[[14,8,6],[15,12,3],[13,5,8],[16,9,7],[18,11,7]];let pi=0;function showPins(){const [big,take]=pinProblems[pi];$('big').textContent=big;$('take').textContent=take;$('pin-board').innerHTML='<i class="pin">📎</i>'.repeat(big);$('pin-instruction').textContent=`Start with ${big} pins. Highlight the first 10.`;$('highlight').disabled=false;$('scratch').disabled=true;$('scratch').textContent=`Scratch Out ${take}`;$('pin-results').innerHTML='';$('pin-feedback').textContent='';$('pin-next').hidden=true}$('highlight').onclick=()=>{const [,take]=pinProblems[pi],pins=[...document.querySelectorAll('.pin')];pins.slice(0,10).forEach(x=>x.classList.add('first-ten'));$('pin-instruction').textContent=take>10?`Scratch the highlighted 10 and ${take-10} more.`:`Scratch only ${take}; leave ${10-take} in the highlighted group.`;$('highlight').disabled=true;$('scratch').disabled=false};$('scratch').onclick=()=>{const [big,take,answer]=pinProblems[pi],pins=[...document.querySelectorAll('.pin')];pins.slice(0,take).forEach(x=>x.classList.add('scratched'));$('pin-instruction').textContent='Count every unscratched pin.';$('scratch').disabled=true;$('pin-results').innerHTML='';[answer-1,answer,answer+1].forEach(value=>{const b=document.createElement('button');b.textContent=value;b.onclick=()=>{if(value===answer){$('pin-feedback').textContent=`Yes! ${big} − ${take} = ${answer}. ⭐`;star();tone(true);$('pin-next').hidden=false}else{$('pin-feedback').textContent='Count the unscratched pins again.';tone(false)}};$('pin-results').appendChild(b)})};$('pin-next').onclick=()=>{pi=(pi+1)%pinProblems.length;showPins()};
rounds[3]={q:'Which object weighs 3 grams?',ok:'pencil'};function shuffled(list){return [...list].sort(()=>Math.random()-.5)}
showDetective=function(){const r=rounds[ri];$('d-prompt').textContent=r.q;$('d-feedback').textContent='';$('d-next').hidden=true;$('d-objects').innerHTML='';$('d-answers').innerHTML='';shuffled(Object.entries(items)).forEach(([key,x])=>{$('d-objects').insertAdjacentHTML('beforeend',`<div class="object-card"><span class="pic">${x[0]}</span><strong>${x[1]}</strong><span class="grams">${x[2]} g</span></div>`);const b=document.createElement('button');b.className='answer';b.textContent=`${x[0]} ${x[1]}`;b.onclick=()=>{if(key===r.ok){b.classList.add('correct');$('d-feedback').textContent='Correct! ⭐';star();tone(true);$('d-next').hidden=false}else{$('d-feedback').textContent='Look at the gram labels and try again.';tone(false)}};$('d-answers').appendChild(b)})};
renderBank=function(){$('bank').querySelectorAll('.supply').forEach(x=>x.remove());shuffled(supplies.map((x,i)=>i)).forEach(i=>{const x=supplies[i],b=document.createElement('button');b.className='supply';b.draggable=true;b.innerHTML=`<span class="pic">${x[0]}</span><strong>${x[1]}</strong><span class="grams">${x[2]} g</span>`;b.ondragstart=e=>e.dataTransfer.setData('text/plain',i);b.onclick=()=>addSupply(i);$('bank').appendChild(b)});updateScale()};
$('scratch').onclick=()=>{const [big,take,answer]=pinProblems[pi],pins=[...document.querySelectorAll('.pin')];pins.slice(0,take).forEach(x=>x.classList.add('scratched'));$('pin-instruction').textContent='Count every unscratched pin.';$('scratch').disabled=true;$('pin-results').innerHTML='';shuffled([answer-1,answer,answer+1]).forEach(value=>{const b=document.createElement('button');b.textContent=value;b.onclick=()=>{if(value===answer){$('pin-feedback').textContent=`Yes! ${big} − ${take} = ${answer}. ⭐`;star();tone(true);$('pin-next').hidden=false}else{$('pin-feedback').textContent='Count the unscratched pins again.';tone(false)}};$('pin-results').appendChild(b)})};
</script></body></html>
