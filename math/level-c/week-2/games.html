<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level C Animal Lab</title><link rel="stylesheet" href="../../game-suite.css"><link rel="stylesheet" href="../../game-art.css"><style>
.mode{margin-top:25px;padding:25px;border:6px solid #fff;border-radius:36px;background:#ffffffdf;box-shadow:0 10px 0 #8bb7db}.mode[hidden],#menu[hidden]{display:none}.mode-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.mode-head h2{font-size:clamp(1.8rem,5vw,2.8rem);margin:5px;color:#5788c5}.small-btn{border:0;border-radius:999px;padding:11px 18px;background:#ddd1ff;font-weight:900;box-shadow:0 5px 0 #aa94df;cursor:pointer}.detective-scene{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:22px 0}.animal-card{display:grid;place-items:center;min-width:160px;padding:14px;border:4px solid #d4e5f2;border-radius:26px;background:#fff}.animal-card .animal-pic{font-size:4.7rem}.animal-card .animal-name{font-weight:900}.animal-card .kg{margin-top:5px;padding:5px 12px;border-radius:10px;background:#e6f2c4;font-size:1.25rem;font-weight:900;white-space:nowrap}.detective-answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.answer-btn{min-height:85px;border:0;border-radius:22px;background:#c9ebff;font-size:1.2rem;font-weight:900;box-shadow:0 6px 0 #79b7d8;cursor:pointer}.answer-btn.correct{background:#b9efa9}.feedback{min-height:2em;font-size:1.3rem;font-weight:900}.scale-game{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:start}.animal-bank{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.drag-animal{border:4px solid #fff;border-radius:22px;background:#eef8ff;padding:10px;box-shadow:0 6px 0 #aac8dc;cursor:grab}.drag-animal .pic{display:block;font-size:3.6rem}.drag-animal .kg{display:block;font-weight:900;white-space:nowrap}.mission{grid-column:1/-1;padding:10px;border-radius:18px;background:#fff3b6;font-size:1.15rem;font-weight:900}.scale-zone{min-height:360px;padding:18px;border:5px dashed #6da4c8;border-radius:32px;background:#e8f8ff}.scale-zone.dragover{background:#d7ffd5}.display{display:inline-block;min-width:165px;padding:12px;border:8px solid #3f5060;border-radius:16px;background:#dff0a8;color:#27351d;font:900 2rem monospace;white-space:nowrap}.tray{display:flex;align-items:end;justify-content:center;gap:8px;min-height:135px;margin:18px auto 0;border-bottom:16px solid #7795a9;border-radius:20px}.on-scale{font-size:4rem;cursor:pointer}.scale-base{width:55%;height:75px;margin:auto;background:linear-gradient(#a9bfcd,#748f9f);clip-path:polygon(35% 0,65% 0,90% 100%,10% 100%)}.scale-actions{display:flex;justify-content:center;gap:12px;margin-top:16px}.action{border:0;border-radius:999px;padding:12px 20px;background:#ffcf55;font-weight:900;box-shadow:0 5px 0 #d79f2f;cursor:pointer}.borrow-problem{font-size:clamp(2.5rem,7vw,4rem);font-weight:900;margin:15px}.borrow-work{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px}.place{min-height:260px;padding:16px;border:4px solid #d8e4ec;border-radius:26px;background:#fff}.place h3{margin:4px}.ten-bundle{display:inline-grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:8px;border:4px solid #e65050;border-radius:15px;background:#fff2f2;cursor:pointer}.clip{display:inline-grid;place-items:center;width:34px;height:50px;margin:3px;border:3px solid #999;border-radius:16px;font-size:1.6rem;background:#fff;cursor:pointer}.clip.red{border-color:#ef4e4e}.clip.crossed{opacity:.25;position:relative}.clip.crossed:after{content:'╱';position:absolute;color:red;font-size:3rem}.minus{font-size:3rem;font-weight:900}.borrow-instruction{padding:12px;border-radius:18px;background:#fff0b8;font-size:1.2rem;font-weight:900}.borrow-controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.borrow-btn{border:0;border-radius:999px;padding:13px 22px;background:#78d5ef;font-weight:900;box-shadow:0 6px 0 #409bb6;cursor:pointer}.borrow-btn:disabled{opacity:.4}.result-choices{display:flex;justify-content:center;gap:12px;margin-top:15px}.result-choices button{min-width:85px;padding:13px;border:0;border-radius:18px;background:#d9ccff;font-size:1.35rem;font-weight:900;box-shadow:0 5px 0 #a68ddc}@media(max-width:720px){.detective-answers,.scale-game{grid-template-columns:1fr}.animal-bank{grid-template-columns:repeat(2,1fr)}.borrow-work{grid-template-columns:1fr}.minus{transform:rotate(90deg)}.place{min-height:190px}.mode-head{align-items:flex-start}}
</style></head><body><main class="suite"><div class="topbar"><a class="back" href="index.html">&#8592; Week 2</a><span class="score">⭐ <span id="stars">0</span></span></div><section id="menu"><h1 class="suite-title">Level C Animal Lab!</h1><p class="subtitle">Choose a visual Math game.</p><div class="game-menu"><button class="game-card" data-open="detective" style="--bg:#dcefff;--shadow:#78acd5"><img class="game-art" src="../../assets/games/level-c-weight-detective.png" alt="Animals being weighed"><strong>Weight Detective</strong><small>Practice heavy, heavier, light, and lighter.</small></button><button class="game-card" data-open="total" style="--bg:#e4f7d8;--shadow:#82b765"><img class="game-art" src="../../assets/games/level-c-total-weight.png" alt="Two animal weights being added"><strong>Total Weight</strong><small>Drag animals onto the scale and add.</small></button><button class="game-card" data-open="borrow" style="--bg:#fff0c2;--shadow:#d6aa47"><img class="game-art" src="../../assets/games/level-c-borrowing-blocks.png" alt="Counting blocks being crossed out"><strong>Borrowing</strong><small>Borrow one ten, subtract, and count.</small></button></div></section>
<section class="mode" id="detective" hidden><div class="mode-head"><button class="small-btn all-games">&#8592; All Games</button><h2>🔍 Weight Detective</h2></div><p class="prompt" id="d-prompt"></p><div class="detective-scene" id="d-scene"></div><div class="detective-answers" id="d-answers"></div><p class="feedback" id="d-feedback" aria-live="polite"></p><button class="action" id="d-next" hidden>Next Question &#10145;</button></section>
<section class="mode" id="total" hidden><div class="mode-head"><button class="small-btn all-games">&#8592; All Games</button><h2>⚖️ Total Weight</h2></div><p class="subtitle">Drag or tap animals to put up to two on the scale.</p><div class="scale-game"><div class="animal-bank" id="animal-bank"><div class="mission">Mission: Make <span id="target">15</span> kg!</div></div><div class="scale-zone" id="scale-zone"><div class="display"><span id="total-number">0</span> kg</div><div class="tray" id="tray"></div><div class="scale-base"></div><p class="feedback" id="scale-feedback">The scale is empty.</p><div class="scale-actions"><button class="action" id="clear-scale">Clear Scale</button><button class="action" id="new-mission">New Mission</button></div></div></div></section>
<section class="mode" id="borrow" hidden><div class="mode-head"><button class="small-btn all-games">&#8592; All Games</button><h2>📎 Borrowing</h2></div><div class="borrow-problem"><span id="minuend">17</span> − <span id="subtrahend">9</span> = ?</div><p class="borrow-instruction" id="borrow-instruction">We need more ones. Tap “Borrow One Ten.”</p><div class="borrow-work"><div class="place"><h3>Tens</h3><div id="tens-area"></div></div><div class="minus">−</div><div class="place"><h3>Ones</h3><div id="ones-area"></div></div></div><div class="borrow-controls"><button class="borrow-btn" id="borrow-ten">Borrow One Ten</button><button class="borrow-btn" id="subtract-ones" disabled>Subtract Ones</button><button class="borrow-btn" id="subtract-tens" disabled>Subtract Tens</button></div><div class="result-choices" id="result-choices"></div><p class="feedback" id="borrow-feedback" aria-live="polite"></p><button class="action" id="borrow-next" hidden>Next Problem &#10145;</button></section></main><script>
const $=id=>document.getElementById(id);let stars=0;function star(){stars++;$('stars').textContent=stars}function tone(ok){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?720:220;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.start();o.stop(c.currentTime+.2)}function openMode(id){$('menu').hidden=true;document.querySelectorAll('.mode').forEach(x=>x.hidden=x.id!==id);if(id==='detective')showDetective();if(id==='total')renderBank();if(id==='borrow')showBorrow()}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMode(b.dataset.open));document.querySelectorAll('.all-games').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.hidden=true);$('menu').hidden=false});
const animals={cheetah:['🐆','Cheetah',50],lion:['🦁','Lion',190],horse:['🐴','Horse',450],turtle:['🐢','Turtle',10],sloth:['🦥','Sloth',5],snail:['🐌','Snail',.03]};const dRounds=[{keys:['cheetah','lion'],q:'Which animal is HEAVIER?',ok:'lion'},{keys:['lion','horse'],q:'Which animal is LIGHTER?',ok:'lion'},{keys:['cheetah','lion','horse'],q:'Which animal is the HEAVIEST?',ok:'horse'},{keys:['cheetah','lion','horse'],q:'Which animal is the LIGHTEST?',ok:'cheetah'},{keys:['turtle','sloth'],q:'Which animal is HEAVY?',ok:'turtle'},{keys:['turtle','sloth'],q:'Which animal is LIGHT?',ok:'sloth'},{keys:['turtle','sloth','snail'],q:'Which animal is the LIGHTEST?',ok:'snail'},{keys:['sloth','snail'],q:'Which animal is HEAVIER?',ok:'sloth'}];let di=0,dLocked=false;function animalHTML(key){const a=animals[key];return `<div class="animal-card"><span class="animal-pic">${a[0]}</span><span class="animal-name">${a[1]}</span><span class="kg">${a[2]} kg</span></div>`}function showDetective(){dLocked=false;const r=dRounds[di];$('d-prompt').textContent=r.q;$('d-scene').innerHTML=r.keys.map(animalHTML).join('');$('d-answers').innerHTML='';$('d-feedback').textContent='';$('d-next').hidden=true;r.keys.forEach(key=>{const a=animals[key],b=document.createElement('button');b.className='answer-btn';b.innerHTML=`${a[0]} ${a[1]}`;b.onclick=()=>{if(dLocked)return;if(key===r.ok){dLocked=true;b.classList.add('correct');$('d-feedback').textContent='Correct! Great weight words! ⭐';star();tone(true);$('d-next').hidden=false}else{$('d-feedback').textContent='Look at the weights and try again.';tone(false)}};$('d-answers').appendChild(b)})}$('d-next').onclick=()=>{di=(di+1)%dRounds.length;showDetective()};
const scaleAnimals=[['🐢','Turtle',10],['🦥','Sloth',5],['🐆','Cheetah',50],['🦁','Lion',190],['🐴','Horse',450],['🐌','Snail',.03]];let placed=[],mission=15;function renderBank(){$('animal-bank').querySelectorAll('.drag-animal').forEach(x=>x.remove());scaleAnimals.forEach((a,i)=>{const b=document.createElement('button');b.className='drag-animal';b.draggable=true;b.innerHTML=`<span class="pic">${a[0]}</span><strong>${a[1]}</strong><span class="kg">${a[2]} kg</span>`;b.ondragstart=e=>e.dataTransfer.setData('text/plain',i);b.onclick=()=>addAnimal(i);$('animal-bank').appendChild(b)});updateScale()}function addAnimal(i){if(placed.length>=2){$('scale-feedback').textContent='The scale can hold two animals. Clear it first!';tone(false);return}placed.push(i);updateScale()}function updateScale(){const total=placed.reduce((s,i)=>s+scaleAnimals[i][2],0);$('total-number').textContent=Number(total.toFixed(2));$('tray').innerHTML=placed.map((i,p)=>`<span class="on-scale" title="Tap to remove" data-pos="${p}">${scaleAnimals[i][0]}</span>`).join('');document.querySelectorAll('.on-scale').forEach(x=>x.onclick=()=>{placed.splice(+x.dataset.pos,1);updateScale()});if(!placed.length)$('scale-feedback').textContent='The scale is empty.';else if(Math.abs(total-mission)<.001){$('scale-feedback').textContent=`You made ${mission} kg! ⭐`;star();tone(true)}else $('scale-feedback').textContent=`Current total: ${Number(total.toFixed(2))} kg`}$('scale-zone').ondragover=e=>{e.preventDefault();$('scale-zone').classList.add('dragover')};$('scale-zone').ondragleave=()=>$('scale-zone').classList.remove('dragover');$('scale-zone').ondrop=e=>{e.preventDefault();$('scale-zone').classList.remove('dragover');addAnimal(+e.dataTransfer.getData('text/plain'))};$('clear-scale').onclick=()=>{placed=[];updateScale()};$('new-mission').onclick=()=>{const missions=[15,55,60,200,240,500];mission=missions[Math.floor(Math.random()*missions.length)];$('target').textContent=mission;placed=[];updateScale()};
const borrowProblems=[[17,9,8],[20,15,5],[16,12,4],[19,13,6]];let bi=0,borrowed=false,onesRemoved=false,tensRemoved=false;function clipHTML(red=false){return `<i class="clip ${red?'red':''}">📎</i>`}function showBorrow(){const [a,b]=borrowProblems[bi];borrowed=false;onesRemoved=false;tensRemoved=false;$('minuend').textContent=a;$('subtrahend').textContent=b;$('tens-area').innerHTML='<div class="ten-bundle">'+clipHTML(true).repeat(10)+'</div>'.repeat(Math.floor(a/10));$('ones-area').innerHTML=clipHTML().repeat(a%10);$('borrow-instruction').textContent=(b%10>a%10)?'We need more ones. Tap “Borrow One Ten.”':'Start by subtracting the ones.';$('borrow-ten').disabled=b%10<=a%10;$('subtract-ones').disabled=b%10>a%10;$('subtract-tens').disabled=true;$('result-choices').innerHTML='';$('borrow-feedback').textContent='';$('borrow-next').hidden=true}function crossOut(area,count){[...area.querySelectorAll('.clip:not(.crossed)')].slice(0,count).forEach(x=>x.classList.add('crossed'))}$('borrow-ten').onclick=()=>{if(borrowed)return;borrowed=true;const bundles=$('tens-area').querySelectorAll('.ten-bundle');if(bundles.length)bundles[bundles.length-1].remove();$('ones-area').insertAdjacentHTML('afterbegin',clipHTML(true).repeat(10));$('borrow-instruction').textContent='One ten became ten ones. Now subtract the ones.';$('borrow-ten').disabled=true;$('subtract-ones').disabled=false};$('subtract-ones').onclick=()=>{if(onesRemoved)return;onesRemoved=true;const b=borrowProblems[bi][1];crossOut($('ones-area'),b%10);$('borrow-instruction').textContent='Great! Now subtract the tens.';$('subtract-ones').disabled=true;$('subtract-tens').disabled=false};$('subtract-tens').onclick=()=>{if(tensRemoved)return;tensRemoved=true;const b=borrowProblems[bi][1];const bundles=[...$('tens-area').querySelectorAll('.ten-bundle')];bundles.slice(0,Math.floor(b/10)).forEach(x=>x.style.opacity='.2');$('borrow-instruction').textContent='Count what is left and choose the answer.';$('subtract-tens').disabled=true;showResults()};function showResults(){const correct=borrowProblems[bi][2],choices=[correct-1,correct,correct+1];$('result-choices').innerHTML='';choices.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(n===correct){$('borrow-feedback').textContent='Excellent regrouping! ⭐';star();tone(true);$('borrow-next').hidden=false}else{$('borrow-feedback').textContent='Count the paperclips left once more.';tone(false)}};$('result-choices').appendChild(b)})}$('borrow-next').onclick=()=>{bi=(bi+1)%borrowProblems.length;showBorrow()};
const prepareBorrowRound=showBorrow;showBorrow=function(){prepareBorrowRound();const a=borrowProblems[bi][0];$('tens-area').innerHTML=Array.from({length:Math.floor(a/10)},()=>'<div class="ten-bundle">'+clipHTML(true).repeat(10)+'</div>').join('')};
let totalChallenge=0;function randomWeight(){return Math.floor(Math.random()*16)+5}function randomizeTotalChallenge(){scaleAnimals.forEach(animal=>{animal[2]=randomWeight()});let first=Math.floor(Math.random()*scaleAnimals.length),second=Math.floor(Math.random()*scaleAnimals.length);while(second===first)second=Math.floor(Math.random()*scaleAnimals.length);mission=scaleAnimals[first][2]+scaleAnimals[second][2];totalChallenge++;$('target').textContent=mission;placed=[]}const drawAnimalBank=renderBank;renderBank=function(){if(totalChallenge===0)randomizeTotalChallenge();drawAnimalBank()};$('new-mission').onclick=()=>{randomizeTotalChallenge();drawAnimalBank();$('scale-feedback').textContent=`Challenge ${totalChallenge}: keep trying until you make ${mission} kg!`};
const pinStyles=document.createElement('style');pinStyles.textContent='.borrow-work{grid-template-columns:1fr}.borrow-work .minus,.borrow-work .place:last-child{display:none}.borrow-work .place{min-height:240px}.borrow-controls #subtract-tens{display:none}.pin-board{display:flex;justify-content:center;align-content:center;flex-wrap:wrap;max-width:680px;margin:auto}.clip.ten-highlight{border-color:#ef404f;background:#ffe1e5;box-shadow:0 0 0 3px #ffabb5}.clip.crossed.ten-highlight{opacity:.3}.group-note{display:block;flex-basis:100%;margin:4px auto 12px;color:#b72f3e;font-weight:900}';document.head.appendChild(pinStyles);
showBorrow=function(){const [big,take]=borrowProblems[bi];$('minuend').textContent=big;$('subtrahend').textContent=take;$('tens-area').parentElement.querySelector('h3').textContent=`All ${big} Pins`;$('tens-area').className='pin-board';$('tens-area').innerHTML=clipHTML().repeat(big);$('ones-area').innerHTML='';$('borrow-instruction').textContent=`Start with all ${big} pins. First, highlight a group of 10.`;$('borrow-ten').textContent='Highlight First 10';$('borrow-ten').disabled=false;$('subtract-ones').textContent=`Scratch Out ${take} Pins`;$('subtract-ones').disabled=true;$('subtract-tens').disabled=true;$('result-choices').innerHTML='';$('borrow-feedback').textContent='';$('borrow-next').hidden=true};
$('borrow-ten').onclick=()=>{const [,take]=borrowProblems[bi],pins=[...$('tens-area').querySelectorAll('.clip')];pins.slice(0,10).forEach(pin=>pin.classList.add('ten-highlight'));$('tens-area').insertAdjacentHTML('afterbegin','<span class="group-note">First group of 10</span>');const extra=Math.max(0,take-10),leave=Math.max(0,10-take);$('borrow-instruction').textContent=take>10?`We need to take away ${take}. Scratch the highlighted 10 and ${extra} more.`:`We need to take away only ${take}. Leave ${leave} of the highlighted group unscratched.`;$('borrow-ten').disabled=true;$('subtract-ones').disabled=false};
$('subtract-ones').onclick=()=>{const [big,take,answer]=borrowProblems[bi],pins=[...$('tens-area').querySelectorAll('.clip')];pins.slice(0,take).forEach(pin=>pin.classList.add('crossed'));$('borrow-instruction').textContent=`${take} pins are scratched out. Count every pin that is still unscratched.`;$('subtract-ones').disabled=true;$('result-choices').innerHTML='';[answer-1,answer,answer+1].forEach(value=>{const button=document.createElement('button');button.textContent=value;button.onclick=()=>{if(value===answer){$('borrow-feedback').textContent=`Yes! ${big} − ${take} = ${answer}. ⭐`;star();tone(true);$('borrow-next').hidden=false}else{$('borrow-feedback').textContent='Count only the unscratched pins and try again.';tone(false)}};$('result-choices').appendChild(button)})};
dRounds.splice(0,dRounds.length,
{keys:['cheetah','lion','horse'],q:'Which animal is HEAVY?',ok:'cheetah'},
{keys:['cheetah','lion','horse'],q:'Which animal is HEAVIER?',ok:'lion'},
{keys:['cheetah','lion','horse'],q:'Which animal is the HEAVIEST?',ok:'horse'},
{keys:['turtle','sloth','snail'],q:'Which animal is LIGHT?',ok:'turtle'},
{keys:['turtle','sloth','snail'],q:'Which animal is LIGHTER?',ok:'sloth'},
{keys:['turtle','sloth','snail'],q:'Which animal is the LIGHTEST?',ok:'snail'});
function shuffled(list){return [...list].sort(()=>Math.random()-.5)}showDetective=function(){dLocked=false;const r=dRounds[di],keys=shuffled(r.keys);$('d-prompt').textContent=r.q;$('d-scene').innerHTML=keys.map(animalHTML).join('');$('d-answers').innerHTML='';$('d-feedback').textContent='';$('d-next').hidden=true;keys.forEach(key=>{const a=animals[key],b=document.createElement('button');b.className='answer-btn';b.innerHTML=`${a[0]} ${a[1]}`;b.onclick=()=>{if(dLocked)return;if(key===r.ok){dLocked=true;b.classList.add('correct');$('d-feedback').textContent='Correct! Great weight words! ⭐';star();tone(true);$('d-next').hidden=false}else{$('d-feedback').textContent='Look at the weights and try again.';tone(false)}};$('d-answers').appendChild(b)})};
renderBank=function(){if(totalChallenge===0)randomizeTotalChallenge();$('animal-bank').querySelectorAll('.drag-animal').forEach(x=>x.remove());shuffled(scaleAnimals.map((x,i)=>i)).forEach(i=>{const a=scaleAnimals[i],b=document.createElement('button');b.className='drag-animal';b.draggable=true;b.innerHTML=`<span class="pic">${a[0]}</span><strong>${a[1]}</strong><span class="kg">${a[2]} kg</span>`;b.ondragstart=e=>e.dataTransfer.setData('text/plain',i);b.onclick=()=>addAnimal(i);$('animal-bank').appendChild(b)});updateScale()};$('new-mission').onclick=()=>{randomizeTotalChallenge();renderBank();$('scale-feedback').textContent=`Challenge ${totalChallenge}: keep trying until you make ${mission} kg!`};
$('subtract-ones').onclick=()=>{const [big,take,answer]=borrowProblems[bi],pins=[...$('tens-area').querySelectorAll('.clip')];pins.slice(0,take).forEach(pin=>pin.classList.add('crossed'));$('borrow-instruction').textContent=`${take} pins are scratched out. Count every pin that is still unscratched.`;$('subtract-ones').disabled=true;$('result-choices').innerHTML='';shuffled([answer-1,answer,answer+1]).forEach(value=>{const button=document.createElement('button');button.textContent=value;button.onclick=()=>{if(value===answer){$('borrow-feedback').textContent=`Yes! ${big} − ${take} = ${answer}. ⭐`;star();tone(true);$('borrow-next').hidden=false}else{$('borrow-feedback').textContent='Count only the unscratched pins and try again.';tone(false)}};$('result-choices').appendChild(button)})};
</script></body></html>
